<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f6f63; color: #fff; user-select: none;
      }
      .logo { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
      .msg { font-size: 0.9rem; opacity: 0.85; }
      .spinner {
        width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="logo">Winstore</div>
    <div class="spinner"></div>
    <div class="msg">Starting your local database…</div>
  </body>
</html>
